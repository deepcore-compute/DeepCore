# -----------------------------------------------------------------------------
# HiveOS "custom miner" package manifest starter template.
#
# Field names and semantics below follow HiveOS's documented custom-miner
# convention (hive/miners/custom in minershive/hiveos-linux): CUSTOM_NAME,
# CUSTOM_VERSION, CUSTOM_CONFIG_FILENAME, CUSTOM_LOG_BASENAME. This is a
# scaffolding template - values marked TODO must be finalized before this
# package can be installed as a HiveOS Custom Miner.
# -----------------------------------------------------------------------------

# The name of the miner. Must match the directory name of the miner package
# once deployed under /hive/miners/custom/<CUSTOM_NAME>/.
CUSTOM_NAME=deepcore-miner

# Version of this custom miner package. TODO: bump on every release; must
# match the version embedded in the binary (DEEPCORE_VERSION_STRING) and the
# release tag/checksum manifest once packaging exists.
CUSTOM_VERSION=0.1.0

# Full path to the miner's config file on the rig, once one exists.
# TODO: finalize once h-config.sh decides whether config is a file or is
# fully expressed via CLI flags in launch-miner.sh.
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/${CUSTOM_NAME}/${CUSTOM_NAME}.json

# Full path to the log file basename, WITHOUT the .log extension - HiveOS
# appends it and uses this path for log truncation/rotation.
CUSTOM_LOG_BASENAME=/var/log/miner/${CUSTOM_NAME}/${CUSTOM_NAME}

# ----- Not yet finalized / not part of the documented h-manifest.conf schema
# ----- but tracked here as TODOs for the packaging milestone:
#
# TODO: --api-port value to pass from h-run.sh / h-stats.sh (the miner's own
#   --api-port flag, not a manifest key) so h-stats.sh can poll GET /summary.
# TODO: coin/algorithm this package supports (ZANO / ProgPowZ) - HiveOS custom
#   miner packages typically document this in README.md, not the manifest,
#   until placement in the Flight Sheet coin list is confirmed.
# TODO: release/download URL once a signed, checksummed release exists -
#   never invent one; HiveOS pulls the package from wherever h-manifest.conf's
#   surrounding install script points it to.
